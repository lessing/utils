<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Home</title>
<style>
  :root {
    --base: #080c20;
    --b1: #3b2a7a;
    --b2: #12407a;
    --b3: #16505e;
    --pad: 120px;
    --font: "LG Smart UI", "Museo Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--font); color: #fff; -webkit-font-smoothing: antialiased; cursor: default; }

  /* Everything is laid out on a fixed 1920×1080 stage and scaled to fit, so the
     browser preview looks exactly like the TV. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; margin: -540px 0 0 -960px;
    overflow: hidden; background: var(--base);
  }

  /* Ambient sky: a few huge soft blobs drifting slowly. Colours follow the time of day. */
  .sky, .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .sky { transition: opacity 1s; }
  .blob { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; opacity: .85; will-change: transform; }
  .b1 { left: -300px; top: -560px; background: radial-gradient(closest-side, var(--b1), rgba(0,0,0,0)); animation: drift1 70s ease-in-out infinite alternate; }
  .b2 { right: -420px; top: -220px; background: radial-gradient(closest-side, var(--b2), rgba(0,0,0,0)); animation: drift2 90s ease-in-out infinite alternate; }
  .b3 { left: 280px; bottom: -820px; background: radial-gradient(closest-side, var(--b3), rgba(0,0,0,0)); animation: drift3 80s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(260px, 140px) scale(1.1); } }
  @keyframes drift2 { to { transform: translate(-220px, 180px) scale(.92); } }
  @keyframes drift3 { to { transform: translate(180px, -160px) scale(1.08); } }
  .shade { background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 100%); }

  /* Clock */
  .top { position: absolute; left: var(--pad); top: 96px; transition: transform 3s ease-in-out, opacity .6s; }
  .greeting { font-size: 38px; font-weight: 500; opacity: .85; }
  .clock { font-size: 200px; font-weight: 200; line-height: 1; letter-spacing: -.045em; margin: 4px 0 10px -8px; font-variant-numeric: tabular-nums; }
  .ampm { font-size: 60px; font-weight: 400; letter-spacing: 0; margin-left: 18px; opacity: .7; }
  .date { font-size: 36px; opacity: .7; }

  /* Rows */
  #rows { position: absolute; left: 0; right: 0; bottom: 116px; transition: opacity .6s; }
  .row + .row { margin-top: 14px; }
  .row-title { margin-left: var(--pad); font-size: 24px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .5; transition: opacity .25s; }
  .row.active .row-title { opacity: .95; }
  .track { position: relative; display: flex; padding: 22px var(--pad) 30px; transition: transform .4s cubic-bezier(.2,.7,.2,1); }

  /* Tiles are quiet glass until focused, then fill with the app's colour. */
  .tile {
    position: relative; flex: 0 0 auto; margin-right: 32px;
    border-radius: 22px; overflow: hidden;
    background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    transition: transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s, color .22s, opacity .25s;
  }
  .tile:last-child { margin-right: 0; }
  .row:not(.active) .tile { opacity: .6; }
  .tile.app { width: 300px; height: 169px; }
  .tile.input { width: 220px; height: 132px; }
  .fill, .sheen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; transition: opacity .22s; }
  .fill { background: linear-gradient(135deg, var(--c), var(--c2)); }
  .sheen { background: linear-gradient(160deg, rgba(255,255,255,.24), rgba(255,255,255,0) 45%); }
  .accent { position: absolute; left: 26px; top: 26px; width: 36px; height: 6px; border-radius: 3px; background: var(--c); transition: opacity .22s; }
  .icon { position: absolute; left: 22px; top: 20px; width: 44px; height: 44px; }
  .label { position: absolute; left: 26px; right: 20px; bottom: 20px; font-size: 34px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.input .label { left: 22px; bottom: 16px; font-size: 26px; font-weight: 600; }

  .tile.focused { transform: scale(1.08); color: var(--on); opacity: 1; box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 24px 56px var(--glow); }
  .tile.focused .fill, .tile.focused .sheen { opacity: 1; }
  .tile.focused .accent { opacity: 0; }
  .tile.focused.pressed { transform: scale(1.02); }

  /* Footer hints + toast */
  .hints { position: absolute; left: var(--pad); bottom: 48px; font-size: 22px; opacity: .5; transition: opacity .6s; }
  .hints span + span { margin-left: 32px; }
  .key { display: inline-block; min-width: 34px; padding: 1px 8px; margin-right: 10px; border: 1px solid rgba(255,255,255,.55); border-radius: 8px; font-size: 18px; text-align: center; }
  #toast {
    position: absolute; right: var(--pad); top: 84px; padding: 18px 30px; border-radius: 40px;
    background: rgba(16,16,24,.85); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    font-size: 26px; white-space: nowrap; pointer-events: none;
    opacity: 0; transform: translateY(-12px); transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: none; }

  /* Ambient mode after a few idle minutes: just the clock, wandering slowly (kind to OLED panels). */
  .idle #rows, .idle .hints { opacity: 0; }
  .idle .sky { opacity: .6; }
</style>
</head>
<body>
<div id="stage">
  <div class="sky"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="shade"></div>

  <header class="top" id="top">
    <div class="greeting" id="greeting"></div>
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
  </header>

  <main id="rows"></main>

  <footer class="hints">
    <span><span class="key">←→↑↓</span>Move</span>
    <span><span class="key">OK</span>Open</span>
  </footer>

  <div id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  // ── Make it yours ────────────────────────────────────────────────────────
  // id    = the webOS app id that gets launched
  // color = tile colour when focused (ink: optional text colour on that fill)
  // icon  = tv | hdmi | globe | sliders (draws an icon instead of the colour bar)
  const CONFIG = {
    name: '',            // e.g. 'Alex' → "Good evening, Alex"
    clock24h: true,
    idleMinutes: 2,      // fade to the ambient clock after this long without input
    rows: [
      { title: 'Apps', items: [
        { name: 'Netflix',     id: 'netflix',                    color: '#E50914' },
        { name: 'YouTube',     id: 'youtube.leanback.v4',        color: '#FF0033' },
        { name: 'Prime Video', id: 'amazon',                     color: '#1A98FF' },
        { name: 'Disney+',     id: 'com.disney.disneyplus-prod', color: '#113CCF' },
        { name: 'Apple TV',    id: 'com.apple.appletv',          color: '#C7C7CC' },
        { name: 'Plex',        id: 'cdp-30',                     color: '#E5A00D' },
        { name: 'Spotify',     id: 'spotify-beehive',            color: '#1ED760' },
      ] },
      { title: 'TV & inputs', items: [
        { name: 'Live TV',  id: 'com.webos.app.livetv',  icon: 'tv' },
        { name: 'HDMI 1',   id: 'com.webos.app.hdmi1',   icon: 'hdmi' },
        { name: 'HDMI 2',   id: 'com.webos.app.hdmi2',   icon: 'hdmi' },
        { name: 'HDMI 3',   id: 'com.webos.app.hdmi3',   icon: 'hdmi' },
        { name: 'Browser',  id: 'com.webos.app.browser', icon: 'globe' },
        { name: 'Settings', id: 'com.palm.app.settings', icon: 'sliders' },
      ] },
    ],
  };

  // Sky colours, picked by the hour they start at.
  const PALETTES = [
    { from: 5,  base: '#24173a', b: ['#e0777d', '#f2a65a', '#6c4f9e'] }, // dawn
    { from: 9,  base: '#0f2c4d', b: ['#3a7bd5', '#1f9fc4', '#6c5ce7'] }, // day
    { from: 17, base: '#1d1033', b: ['#ff6a5c', '#b23a8a', '#3d2c8d'] }, // dusk
    { from: 21, base: '#080c20', b: ['#3b2a7a', '#12407a', '#16505e'] }, // night
  ];

  const ICONS = {
    tv: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
    hdmi: '<path d="M3 8h18v5l-3 3H6l-3-3z"/><path d="M8 11.5h8"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  };

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const query = new URLSearchParams(location.search);
  const forcedHour = query.has('hour') ? parseInt(query.get('hour'), 10) % 24 : NaN; // ?hour=7 previews dawn

  // ── Colour helpers ───────────────────────────────────────────────────────
  function rgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function shade(hex, k) {
    return 'rgb(' + rgb(hex).map((v) => Math.round(v * k)).join(',') + ')';
  }
  function rgba(hex, a) {
    return 'rgba(' + rgb(hex).join(',') + ',' + a + ')';
  }
  function inkOn(hex) {
    const c = rgb(hex);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255 > 0.55 ? '#111' : '#fff';
  }

  // ── Build the rows ───────────────────────────────────────────────────────
  const rows = CONFIG.rows.filter((row) => row.items && row.items.length).map((row, r) => {
    const el = document.createElement('section');
    el.className = 'row';
    el.innerHTML = '<h2 class="row-title"></h2><div class="track"></div>';
    el.querySelector('.row-title').textContent = row.title;
    const track = el.querySelector('.track');

    const tiles = row.items.map((item, c) => {
      const color = item.color || '#ffffff';
      const t = document.createElement('div');
      t.className = 'tile ' + (item.icon ? 'input' : 'app');
      t.style.setProperty('--c', color);
      t.style.setProperty('--c2', shade(color, 0.78));
      t.style.setProperty('--on', item.ink || inkOn(color));
      t.style.setProperty('--glow', rgba(color, 0.45));
      t.innerHTML = '<div class="fill"></div><div class="sheen"></div>' +
        (item.icon
          ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[item.icon] || '') + '</svg>'
          : '<div class="accent"></div>') +
        '<div class="label"></div>';
      t.querySelector('.label').textContent = item.name;
      // mousemove rather than mouseenter, so tiles sliding under a still pointer don't steal focus
      t.addEventListener('mousemove', () => { if (cur.r !== r || cur.c !== c) focus(r, c); });
      t.addEventListener('click', () => { focus(r, c); open(item, t); });
      track.appendChild(t);
      return t;
    });

    $('rows').appendChild(el);
    return { el: el, track: track, tiles: tiles, items: row.items, scroll: 0 };
  });

  // ── Focus + remote navigation ────────────────────────────────────────────
  let cur = { r: 0, c: 0 };
  const tileAt = (pos) => rows[pos.r].tiles[pos.c];

  function focus(r, c) {
    tileAt(cur).classList.remove('focused');
    rows[cur.r].el.classList.remove('active');
    cur = { r: r, c: c };
    tileAt(cur).classList.add('focused');
    rows[r].el.classList.add('active');
    reveal(rows[r], tileAt(cur));
    try { localStorage.setItem('tvhome.focus', JSON.stringify(cur)); } catch (e) {}
  }

  // Slide the row so the focused tile stays fully on screen.
  function reveal(row, tile) {
    const pad = parseFloat(getComputedStyle(row.track).paddingLeft);
    const left = tile.offsetLeft;
    const right = left + tile.offsetWidth;
    let s = row.scroll;
    if (right + pad > s + 1920) s = right + pad - 1920;
    if (left - pad < s) s = left - pad;
    s = Math.max(0, s);
    if (s !== row.scroll) {
      row.scroll = s;
      row.track.style.transform = 'translateX(' + (-s) + 'px)';
    }
  }

  function move(dr, dc) {
    if (dc) {
      const c = cur.c + dc;
      if (c >= 0 && c < rows[cur.r].tiles.length) focus(cur.r, c);
      return;
    }
    const r = cur.r + dr;
    if (r < 0 || r >= rows.length) return;
    // Land on whichever tile in the next row sits closest to the current one.
    const from = tileAt(cur).getBoundingClientRect();
    const x = from.left + from.width / 2;
    let best = 0;
    let bestD = Infinity;
    rows[r].tiles.forEach((t, i) => {
      const b = t.getBoundingClientRect();
      const d = Math.abs(b.left + b.width / 2 - x);
      if (d < bestD) { bestD = d; best = i; }
    });
    focus(r, best);
  }

  document.addEventListener('keydown', (e) => {
    if (wake()) { e.preventDefault(); return; } // first press only wakes from ambient mode
    switch (e.keyCode) {
      case 37: move(0, -1); break;
      case 39: move(0, 1); break;
      case 38: move(-1, 0); break;
      case 40: move(1, 0); break;
      case 13: open(rows[cur.r].items[cur.c], tileAt(cur)); break;
      case 461: case 27: break; // Back: we're already home
      default: return;
    }
    e.preventDefault();
  });
  document.addEventListener('mousemove', wake);

  // ── Launching apps (webOS Luna bus) ──────────────────────────────────────
  const bridges = new Set();
  function luna(uri, params) {
    return new Promise((resolve, reject) => {
      const bridge = new window.PalmServiceBridge();
      bridges.add(bridge); // hold a reference until the reply arrives, or it can be garbage-collected mid-call
      bridge.onservicecallback = (msg) => {
        bridges.delete(bridge);
        let res = {};
        try { res = JSON.parse(msg); } catch (e) {}
        if (res.returnValue === false) reject(res); else resolve(res);
      };
      bridge.call(uri, JSON.stringify(params));
    });
  }

  function open(item, tile) {
    tile.classList.add('pressed');
    setTimeout(() => tile.classList.remove('pressed'), 160);
    if (!window.PalmServiceBridge) {
      toast('Preview · would open ' + item.name);
      return;
    }
    luna('luna://com.webos.applicationManager/launch', { id: item.id, params: item.params || {} })
      .catch((err) => toast('Couldn’t open ' + item.name + (err && err.errorText ? ' — ' + err.errorText : '')));
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ── Clock, greeting, sky ─────────────────────────────────────────────────
  let lastMinute = -1;
  const two = (n) => (n < 10 ? '0' : '') + n;

  function tick(force) {
    const now = new Date();
    const m = now.getMinutes();
    if (!force && m === lastMinute) return;
    lastMinute = m;

    const h = isNaN(forcedHour) ? now.getHours() : forcedHour;
    $('clock').innerHTML = CONFIG.clock24h
      ? two(h) + ':' + two(m)
      : ((h % 12) || 12) + ':' + two(m) + '<span class="ampm">' + (h < 12 ? 'AM' : 'PM') + '</span>';
    $('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

    const part = h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'afternoon' : 'evening';
    $('greeting').textContent = 'Good ' + part + (CONFIG.name ? ', ' + CONFIG.name : '');

    let p = PALETTES[PALETTES.length - 1];
    PALETTES.forEach((x) => { if (h >= x.from) p = x; });
    const s = document.documentElement.style;
    s.setProperty('--base', p.base);
    s.setProperty('--b1', p.b[0]);
    s.setProperty('--b2', p.b[1]);
    s.setProperty('--b3', p.b[2]);
  }

  // ── Ambient mode ─────────────────────────────────────────────────────────
  let idle = false;
  let idleTimer;
  let driftTimer;

  function wake() {
    const wasIdle = idle;
    if (idle) {
      idle = false;
      document.body.classList.remove('idle');
      clearInterval(driftTimer);
      $('top').style.transform = '';
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(sleep, CONFIG.idleMinutes * 60000);
    return wasIdle;
  }

  function sleep() {
    idle = true;
    document.body.classList.add('idle');
    drift();
    driftTimer = setInterval(drift, 45000);
  }

  // Wander the clock around so nothing sits on the same pixels for long.
  function drift() {
    const x = Math.round(Math.random() * 900);
    const y = Math.round(Math.random() * 450);
    $('top').style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  function fit() {
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  tick(true);
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(true); });
  document.addEventListener('webOSRelaunch', () => { tick(true); wake(); });

  let start = { r: 0, c: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem('tvhome.focus'));
    if (saved && rows[saved.r] && rows[saved.r].tiles[saved.c]) start = saved;
  } catch (e) {}
  focus(start.r, start.c);
  wake();
})();
</script>
</body>
</html>
